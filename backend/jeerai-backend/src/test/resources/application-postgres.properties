# Override main application-postgres.properties so integration tests use H2, not a local Postgres instance.
spring.datasource.url=jdbc:h2:mem:jeerai_test;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true

app.integration.secret-encryption-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

spring.ai.openai.api-key=test-dummy-key-for-spring-context
spring.ai.openai.base-url=https://openrouter.ai/api/v1
