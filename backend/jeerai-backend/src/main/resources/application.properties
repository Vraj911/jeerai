spring.application.name=jeerai-backend
server.port=5000

# Optional local "env file" (properties format). Put it in the backend folder as:
# backend/jeerai-backend/.env.properties
spring.config.import=optional:file:./.env.properties

# Start with the JDBC-backed repository adapters unless explicitly overridden.
spring.profiles.default=postgres

app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-123456}
app.security.jwt.expiration=86400000

# --- Invitations / Mail
app.invitation.base-url=${INVITATION_BASE_URL:http://localhost:5173/invite/}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@jeerai.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.ai.enabled=true
app.ai.context.max-issues=50
app.ai.context.max-priority-issues=30
app.ai.openrouter.referer=http://localhost:5173
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=openai/gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=2000
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}

# --- Automation
app.automation.max-depth=3
app.integration.oauth.redirect-base-url=https://jeerai.netlify.app
app.integration.oauth.frontend-base-url=http://localhost:5173
app.integration.secret-encryption-key=${APP_INTEGRATION_SECRET_KEY:}
