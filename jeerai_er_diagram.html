
<style>
*{box-sizing:border-box;margin:0;padding:0}
#erd{width:100%;overflow-x:auto}
#erd svg{display:block;width:100%}
.mermaid-legend{display:flex;gap:16px;flex-wrap:wrap;padding:.75rem 1rem;font-size:12px;color:var(--color-text-secondary);border-top:0.5px solid var(--color-border-tertiary);margin-top:.5rem}
.leg{display:flex;align-items:center;gap:6px}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
</style>
<div id="erd"></div>
<div class="mermaid-legend">
  <div class="leg"><div class="leg-dot" style="background:#534AB7"></div>Auth / Users</div>
  <div class="leg"><div class="leg-dot" style="background:#0F6E56"></div>Workspaces</div>
  <div class="leg"><div class="leg-dot" style="background:#854F0B"></div>Projects</div>
  <div class="leg"><div class="leg-dot" style="background:#185FA5"></div>Issues</div>
  <div class="leg"><div class="leg-dot" style="background:#993C1D"></div>Notifications / Activity</div>
</div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    tertiaryColor: dark ? '#633806' : '#FAEEDA',
    edgeLabelBackground: dark ? '#2C2C2A' : '#F1EFE8',
  },
});

const diagram = `erDiagram
  USERS {
    uuid id PK
    string public_id
    string name
    string email
    string password_hash
    timestamp created_at
  }

  WORKSPACES {
    uuid id PK
    string name
    uuid owner_id FK
    timestamp created_at
  }

  WORKSPACE_MEMBERS {
    uuid id PK
    uuid workspace_id FK
    uuid user_id FK
    enum role
    timestamp joined_at
  }

  INVITATIONS {
    uuid id PK
    uuid workspace_id FK
    string email
    enum role
    string token
    enum status
    timestamp expires_at
    timestamp created_at
  }

  PROJECTS {
    uuid id PK
    string public_id
    string key
    string name
    string description
    uuid lead_id FK
    uuid workspace_id FK
    timestamp created_at
    timestamp updated_at
  }

  PROJECT_MEMBERS {
    uuid project_id FK
    uuid user_id FK
  }

  PROJECT_PERMISSIONS {
    uuid id PK
    uuid project_id FK
    enum role
    enum permission
    boolean allowed
  }

  SPRINTS {
    uuid id PK
    string public_id
    string name
    uuid project_id FK
    date start_date
    date end_date
    boolean is_active
  }

  ISSUES {
    uuid id PK
    string public_id
    string key
    string title
    enum status
    enum priority
    uuid assignee_id FK
    uuid reporter_id FK
    uuid project_id FK
    uuid sprint_id FK
    text description
    timestamp created_at
    timestamp updated_at
  }

  ISSUE_LABELS {
    uuid issue_id FK
    string label
  }

  ISSUE_COMMENTS {
    uuid id PK
    string public_id
    uuid issue_id FK
    uuid author_id FK
    text content
    timestamp created_at
  }

  ACTIVITIES {
    uuid id PK
    string public_id
    string type
    uuid actor_id FK
    string target_id
    string target_key
    string target_title
    string detail
    uuid project_id FK
    timestamp created_at
  }

  NOTIFICATIONS {
    uuid id PK
    string public_id
    string recipient_user_id
    string title
    string description
    boolean is_read
    string target_id
    string type
    timestamp created_at
  }

  AUTOMATION_RULES {
    uuid id PK
    string public_id
    string name
    uuid project_id FK
    string trigger_type
    string trigger_value
    string action_type
    string action_value
    boolean enabled
    timestamp created_at
  }

  AUTOMATION_RULE_CONDITIONS {
    uuid rule_id FK
    int position
    string type
    string value
  }

  USERS ||--o{ WORKSPACES : "owns"
  USERS ||--o{ WORKSPACE_MEMBERS : "joins"
  WORKSPACES ||--o{ WORKSPACE_MEMBERS : "has"
  WORKSPACES ||--o{ INVITATIONS : "sends"
  WORKSPACES ||--o{ PROJECTS : "contains"
  USERS ||--o{ PROJECTS : "leads"
  PROJECTS ||--o{ PROJECT_MEMBERS : "has"
  USERS ||--o{ PROJECT_MEMBERS : "member of"
  PROJECTS ||--o{ PROJECT_PERMISSIONS : "has"
  PROJECTS ||--o{ SPRINTS : "has"
  PROJECTS ||--o{ ISSUES : "contains"
  SPRINTS ||--o{ ISSUES : "groups"
  USERS ||--o{ ISSUES : "assigned to"
  USERS ||--o{ ISSUES : "reports"
  ISSUES ||--o{ ISSUE_LABELS : "tagged"
  ISSUES ||--o{ ISSUE_COMMENTS : "has"
  USERS ||--o{ ISSUE_COMMENTS : "writes"
  PROJECTS ||--o{ ACTIVITIES : "logs"
  USERS ||--o{ ACTIVITIES : "acts in"
  PROJECTS ||--o{ AUTOMATION_RULES : "defines"
  AUTOMATION_RULES ||--o{ AUTOMATION_RULE_CONDITIONS : "has"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0],nums[2],nums[4],nums[6]];
  const ys = [nums[1],nums[3],nums[5],nums[7]];
  const x=Math.min(...xs),y=Math.min(...ys);
  const w=Math.max(...xs)-x,h=Math.max(...ys)-y;
  const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x);rect.setAttribute('y',y);
  rect.setAttribute('width',w);rect.setAttribute('height',h);
  rect.setAttribute('rx','8');
  for(const a of['fill','stroke','stroke-width','class','style']){
    if(firstPath.hasAttribute(a))rect.setAttribute(a,firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p=>{
  p.setAttribute('stroke','none');
});
</script>
